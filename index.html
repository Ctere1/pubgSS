<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

    <title>PUBG Stream Sniping Detector</title>
    <meta name="description" content="Desktop tool to investigate potential stream sniping patterns in PUBG match history. JSON export, PDF reports and player comparison." />
    <meta name="keywords" content="PUBG, stream sniping, detector, analytics, esports, player comparison, match analysis" />
    <meta name="author" content="Ctere1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://ctere1.github.io/pubgSS/" />

    <!-- Open Graph -->
    <meta property="og:title" content="PUBG Stream Sniping Detector" />
    <meta property="og:description" content="Desktop tool to investigate potential stream sniping patterns using PUBG match history data." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ctere1.github.io/pubgSS/" />
    <meta property="og:image" content="https://ctere1.github.io/pubgSS/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stream Sniping Detector — PUBG match analysis" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PUBG Stream Sniping Detector" />
    <meta name="twitter:description" content="Desktop tool to investigate potential stream sniping patterns in PUBG." />
    <meta name="twitter:image" content="https://ctere1.github.io/pubgSS/og-card.png" />

    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />

    <!-- Generated from brand/app-icon-1024.png, e.g.
         sips -s format png -z 32 32 brand/app-icon-1024.png --out public/favicon-32.png
         Paths must NOT include the base: Vite prefixes it in dev and build,
         so writing it here yields /pubgSS/pubgSS/... and a 404. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <script>
        // Apply the stored theme before first paint to avoid a flash of the wrong theme.
        // Must stay in sync with src/hooks/useTheme.js (same storage key).
        (function () {
            try {
                var stored = localStorage.getItem('pubgss-theme-preference');
                var dark = stored === 'dark' ||
                    (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
                var meta = document.getElementById('theme-color-meta');
                if (meta) meta.setAttribute('content', dark ? '#0b0f14' : '#ffffff');
            } catch (e) { /* localStorage unavailable — fall back to light */ }
        })();
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PUBG Stream Sniping Detector",
      "operatingSystem": ["Windows", "macOS"],
      "applicationCategory": "Utility",
      "description": "Analysis tool to investigate potential stream sniping patterns in PUBG using match history.",
      "softwareVersion": "3.3.0",
      "author": { "@type": "Person", "name": "Ctere1" },
      "publisher": { "@type": "Organization", "name": "Ctere1" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
